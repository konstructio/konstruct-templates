{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "<REPO_NAME>.fullname" . }}-parameter-store
  labels:
    {{- include "<REPO_NAME>.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: ParameterStore
      region: {{ .Values.externalSecrets.region | quote }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ include "<REPO_NAME>.fullname" . }}-eso
{{- end }}
