{{- if and .Values.externalSecrets.enabled .Values.externalSecrets.data }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "<REPO_NAME>.fullname" . }}
  labels:
    {{- include "<REPO_NAME>.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    kind: SecretStore
    name: {{ include "<REPO_NAME>.fullname" . }}-parameter-store
  target:
    name: {{ include "<REPO_NAME>.fullname" . }}-secrets
  data:
    {{- range .Values.externalSecrets.data }}
    - secretKey: {{ .secretKey | quote }}
      remoteRef:
        key: {{ .remoteKey | quote }}
    {{- end }}
{{- end }}
