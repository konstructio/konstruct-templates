{{- if .Values.externalSecrets.enabled }}
{{- if not .Values.externalSecrets.roleArn }}
{{- fail "externalSecrets.roleArn is required when externalSecrets.enabled is true" }}
{{- end }}
# Used only by the External Secrets Operator to authenticate the SecretStore.
# Kept separate from the app's own ServiceAccount so the pods never carry the
# IAM role — they only ever see the resulting Secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "<REPO_NAME>.fullname" . }}-eso
  labels:
    {{- include "<REPO_NAME>.labels" . | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.externalSecrets.roleArn | quote }}
{{- end }}
