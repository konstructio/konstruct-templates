replicaCount: 1

image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}


service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}

# livenessProbe:
#   httpGet:
#     path: /
#     port: http
# readinessProbe:
#   httpGet:
#     path: /
#     port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []

volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}

# Secrets from AWS SSM Parameter Store, through a namespaced SecretStore owned
# by this release. Off until the IAM role below exists.
externalSecrets:
  enabled: false
  # AWS region of the Parameter Store holding the parameters.
  region: us-west-2
  # IAM role the SecretStore authenticates as (IRSA). Its trust policy must
  # allow system:serviceaccount:<namespace>:<fullname>-eso, and its policy
  # should only grant the parameters listed in `data`.
  roleArn: ""
  refreshInterval: 1h
  # Each entry becomes one key of the <fullname>-secrets Secret, which the
  # Deployment loads as environment variables.
  #   - secretKey: DB_PASSWORD
  #     remoteKey: /apps/<namespace>/<app>/DB_PASSWORD
  data: []
