{{- /*
Platform auth gate (epic &231): OIDC SecurityPolicy on the app's HTTPRoute.
Rendered only when the theme-operator passes gateway.auth (spec.auth
"platform", the default) — apps that opted out (spec.auth "none") get the
open route exactly as before. Every app shares ONE IdP client, callback and
cookie domain, so a single login covers all gated apps; the client secret is
distributed to the app namespace by the operator (key "client-secret" is
Envoy Gateway's required name). SameSite=None keeps the session when the
console embeds the app in a cross-origin iframe.

targetRefs MUST resolve to the HTTPRoute this chart renders. Both use the
fullname helper: a SecurityPolicy pointing at a name no route carries is
simply not accepted by Envoy Gateway, and the app is then served WITHOUT
auth — a silent fail-open on a security control rather than a loud error.
*/ -}}
{{- if and .Values.gateway.enabled .Values.gateway.auth .Values.gateway.auth.enabled }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ include "konstruct-web-service.fullname" . }}
  labels:
    {{- include "konstruct-web-service.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "konstruct-web-service.fullname" . }}
  oidc:
    provider:
      issuer: {{ .Values.gateway.auth.issuer | quote }}
    clientID: {{ .Values.gateway.auth.clientID | default "themed-apps" | quote }}
    clientSecret:
      name: {{ .Values.gateway.auth.secretName | default "themed-apps-oidc" | quote }}
    redirectURL: {{ .Values.gateway.auth.redirectURL | quote }}
    logoutPath: /oauth2/logout
    {{- with .Values.gateway.auth.cookieDomain }}
    cookieDomain: {{ . | quote }}
    {{- end }}
    cookieConfig:
      sameSite: None
    scopes: ["openid", "profile", "email"]
    # Forward the session's access token so the app can attribute actions to
    # the signed-in user (theme-foxglider#1). Gateway-derived, so trustable.
    forwardAccessToken: true
{{- end }}
