# groundcover sensor configuration
# Deploys the groundcover SENSOR ONLY (backend.enabled=false) against a
# self-hosted or SaaS groundcover backend. Ingestion key is delivered via
# ExternalSecret from the cluster's ClusterSecretStore — never inline.
#
# Only clusterName is required. Everything else has working defaults,
# assuming the cluster's ClusterSecretStore follows the standard name
# ("cluster-secret-store") and the shared ingestion key is seeded at
# konstruct/shared/groundcover.

# @input.type: string
# @input.description: Cluster to deploy the sensor to (also used as clusterId in groundcover)
# @input.required: true
# @input.default: my-cluster
clusterName: my-cluster

# @input.type: string
# @input.description: ArgoCD destination cluster (defaults to clusterName)
# @input.required: false
# @input.default: ""
clusterDestination: ""

# @input.type: string
# @input.description: Display name / clusterId in groundcover (defaults to clusterName)
# @input.required: false
# @input.default: ""
clusterDisplayName: ""

# @input.type: string
# @input.description: ArgoCD project name
# @input.required: false
# @input.default: default
project: default

# @input.type: string
# @input.description: Namespace for the groundcover sensor
# @input.required: false
# @input.default: groundcover
namespace: groundcover

# @input.type: string
# @input.description: groundcover Helm chart version (helm.groundcover.com)
# @input.required: false
# @input.default: 1.11.832
chartVersion: 1.11.832

# @input.type: string
# @input.description: groundcover ingestion endpoint hostname
# @input.required: false
# @input.default: ingest.groundcover.civo.io
ingestEndpoint: ingest.groundcover.civo.io

# @input.type: string
# @input.description: ClusterSecretStore holding the ingestion key
# @input.required: false
# @input.default: cluster-secret-store
secretStoreName: cluster-secret-store

# @input.type: string
# @input.description: Secret-store path for the groundcover ingestion key
# @input.required: false
# @input.default: konstruct/shared/groundcover
secretPath: konstruct/shared/groundcover

# @input.type: secret
# @input.description: groundcover ingestion API key (leave blank when the key is already in the secret store)
# @input.required: false
# @input.secretKey: ingestion-key
# @input.secretEnv: GROUNDCOVER_API_KEY
# @input.secretBackend: aws-secrets-store
# @input.secretPath: konstruct/shared/groundcover
groundcoverApiKey: <GROUNDCOVER_API_KEY>

# @input.type: string
# @input.description: Number of vector (logs pipeline) replicas — 1 fits small clusters
# @input.required: false
# @input.default: 1
vectorReplicas: 1

# @input.type: string
# @input.description: Memory request for each vector replica
# @input.required: false
# @input.default: 512Mi
vectorMemoryRequest: 512Mi

# @input.type: string
# @input.description: Memory limit for each vector replica
# @input.required: false
# @input.default: 2048Mi
vectorMemoryLimit: 2048Mi
