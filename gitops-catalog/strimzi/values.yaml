# Strimzi Kafka Operator Configuration
# This values file contains all configurable parameters for deploying the Strimzi Kafka Operator via ArgoCD

# @input.type: string
# @input.description: Cluster name identifier
# @input.required: true
# @input.default: my-cluster
clusterName: my-cluster

# @input.type: string
# @input.description: GitOps repository URL for ArgoCD sync
# @input.required: true
# @input.default: https://github.com/example/gitops-repo
gitopsRepoUrl: https://github.com/example/gitops-repo

# @input.type: string
# @input.description: Registry path in GitOps repository
# @input.required: true
# @input.default: registry/clusters/my-cluster
registryPath: registry/clusters/my-cluster

# @input.type: string
# @input.description: Target cluster destination for ArgoCD
# @input.required: true
# @input.default: in-cluster
clusterDestination: in-cluster

# @input.type: string
# @input.description: ArgoCD project name
# @input.required: true
# @input.default: default
project: default

# @input.type: string
# @input.description: Namespace for the Strimzi Kafka Operator deployment
# @input.required: true
# @input.default: strimzi
namespace: strimzi

# @input.type: string
# @input.description: Strimzi Kafka Operator Helm chart version
# @input.required: true
# @input.default: 1.1.0
chartVersion: 1.1.0

# =============================================================================
# STRIMZI CONFIGURATION
# =============================================================================

# @input.type: enum
# @input.description: Watch Kafka resources in all namespaces (false limits the operator to its own namespace)
# @input.options: true,false
# @input.required: true
# @input.default: false
watchAnyNamespace: false

# @input.type: number
# @input.description: Number of operator replicas (more than 1 enables leader election with standby replicas)
# @input.required: true
# @input.default: 1
replicas: 1

# @input.type: string
# @input.description: Operator log level (ERROR, WARN, INFO, DEBUG, TRACE)
# @input.required: true
# @input.default: INFO
logLevel: INFO
