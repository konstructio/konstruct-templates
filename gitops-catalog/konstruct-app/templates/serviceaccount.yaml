# Used only by the External Secrets Operator to authenticate the SecretStore.
# The application keeps its own ServiceAccount, so its pods never carry this
# IAM role - they only ever see the resulting Secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccountName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/component: parameter-store-secrets
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.roleArn | quote }}
