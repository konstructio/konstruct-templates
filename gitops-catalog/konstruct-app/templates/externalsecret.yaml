{{- $path := trimSuffix "/" .Values.parameterPath }}
# Every parameter under parameterPath becomes one key of the target Secret.
# Parameter names are full paths, which are not valid Secret keys, so the
# prefix is stripped and any remaining "/" (nested paths) becomes "_":
#   /apps/my-app/DB_PASSWORD     -> DB_PASSWORD
#   /apps/my-app/db/password     -> db_password
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/component: parameter-store-secrets
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    kind: SecretStore
    name: {{ .Values.name }}-parameter-store
  target:
    name: {{ .Values.targetSecretName }}
    creationPolicy: Owner
  dataFrom:
    - find:
        path: {{ $path | quote }}
        name:
          regexp: ".*"
      rewrite:
        - regexp:
            source: {{ printf "^%s/" (regexQuoteMeta $path) | quote }}
            target: ""
        - regexp:
            source: "/"
            target: "_"
