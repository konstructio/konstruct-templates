# Namespaced on purpose: only workloads in this namespace can reference it, and
# it authenticates as this namespace's ServiceAccount, so the IAM role behind it
# is scoped to one application rather than shared cluster-wide.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.name }}-parameter-store
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/component: parameter-store-secrets
spec:
  provider:
    aws:
      service: ParameterStore
      region: {{ .Values.region | quote }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.serviceAccountName }}
