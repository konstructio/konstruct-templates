# Konstruct app: a Konstruct-built application with secrets from AWS SSM
# Parameter Store
#
# Renders one Argo CD Application for the app's OCI chart and switches on the
# chart's externalSecrets block. The chart then creates, in the app's
# namespace, the <name>-eso ServiceAccount (IRSA), a namespaced SecretStore and
# an ExternalSecret, and loads the <name>-secrets Secret into the Deployment.
#
# Prerequisites:
#   - the app's chart has the externalSecrets block (charts generated from
#     helm-templates/charts do);
#   - the IAM role in roleArn, which the aws-parameter-store-role catalog app
#     creates, trusting system:serviceaccount:<namespace>:<name>-eso and
#     granting only parameterPath.

# @input.type: string
# @input.description: Workload cluster the application runs on; used as the Argo CD project and destination cluster
# @input.required: true
# @input.default: my-cluster
clusterName: my-cluster

# @input.type: string
# @input.description: Namespace the application runs in; every resource is created there
# @input.required: true
# @input.default: my-app
namespace: my-app

# @input.type: string
# @input.description: Application name; also names its <name>-eso ServiceAccount, SecretStore, ExternalSecret and <name>-secrets Secret
# @input.required: true
# @input.default: my-app
name: my-app

# @input.type: string
# @input.description: OCI repository of the application's Helm chart, e.g. oci://<account>.dkr.ecr.<region>.amazonaws.com/<org>/charts/<repo>
# @input.required: true
# @input.default: oci://123456789012.dkr.ecr.us-west-2.amazonaws.com/my-org/charts/my-app
chartRepoUrl: oci://123456789012.dkr.ecr.us-west-2.amazonaws.com/my-org/charts/my-app

# @input.type: string
# @input.description: Name of the application's Helm chart (the repository name)
# @input.required: true
# @input.default: my-app
chartName: my-app

# @input.type: string
# @input.description: Chart version to deploy, as published by the app's workflow (e.g. 0.1.0-rc.abc1234)
# @input.required: true
# @input.default: 0.1.0
chartVersion: 0.1.0

# @input.type: string
# @input.description: Container image repository for the application, without a tag
# @input.required: true
# @input.default: 123456789012.dkr.ecr.us-west-2.amazonaws.com/my-org/my-app
imageRepository: 123456789012.dkr.ecr.us-west-2.amazonaws.com/my-org/my-app

# @input.type: string
# @input.description: ARN of the IAM role allowed to read the parameters (output role_arn of aws-parameter-store-role)
# @input.required: true
# @input.default: arn:aws:iam::123456789012:role/my-app-parameter-store
roleArn: arn:aws:iam::123456789012:role/my-app-parameter-store

# @input.type: string
# @input.description: AWS region of the Parameter Store holding the parameters
# @input.required: true
# @input.default: us-west-2
region: us-west-2

# @input.type: string
# @input.description: Parameter path prefix holding the secretKeys, without a trailing slash
# @input.required: true
# @input.default: /apps/my-app
parameterPath: /apps/my-app

# @input.type: string
# @input.description: Comma-separated parameter names under parameterPath to load as environment variables, e.g. DB_PASSWORD,API_KEY
# @input.required: true
# @input.default: DB_PASSWORD
secretKeys: DB_PASSWORD

refreshInterval: 1h
