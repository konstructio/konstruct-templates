clusterType: physical

# @input.type: boolean
# @input.description: Provision this cluster as a Theme cluster — hosts Foreman single-click apps at <app>.<cluster>.apps.<domainName>, ships metrics to the control plane via kube-prometheus-stack, and adds the Theme app registry. Requires domainName.
# @input.required: false
theme: false

# Terraform Module Configuration
# @input.type: string
# @input.description: the complete URL for the Terraform module for infrastructure provisioning
# @input.required: true
workloadClusterTerraformModuleUrl: "git::https://github.com/konstructio/konstruct-templates.git//terraform/civo/modules/workload-cluster?ref=main"

workloadClusterBootstrapTerraformModuleUrl: "git::https://github.com/konstructio/konstruct-templates.git//terraform/civo/modules/workload-cluster-bootstrap?ref=main"

# @input.type: enum
# @input.description: CNI for the cluster. Theme clusters always use cilium (required so the per-app tenant-isolation NetworkPolicies are enforced); empty leaves the Civo default.
# @input.options: cilium,flannel
# @input.required: false
cni: ""

# Wait Job Configuration
waitJobImage: "dtzar/helm-kubectl:3.19.0"

# @input.type: string
# @input.description: Theme clusters only — alert email address for Let's Encrypt certificate notifications
# @input.required: false
email: alerts@konstruct.io

# @input.type: string
# @input.description: Theme clusters only — DNS zone Theme apps are served under; apps resolve at <app>.<cluster>.apps.<domainName>
# @input.required: false
domainName: konstruct.io

# @input.type: string
# @input.description: Theme clusters only — external-dns provider name (e.g. cloudflare, civo)
# @input.required: false
externalDnsProviderName: cloudflare

externalDnsProviderTokenEnvName: CF_API_TOKEN

# @input.type: string
# @input.description: Theme clusters only — Prometheus remote_write endpoint that cluster metrics are shipped to
# @input.required: false
prometheusRemoteWriteUrl: "https://prometheus-remote-write.saas.konstruct.io/api/v1/write"
