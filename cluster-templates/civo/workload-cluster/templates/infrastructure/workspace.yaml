apiVersion: tf.upbound.io/v1beta1
kind: Workspace
metadata:
  name: {{ .Values.workloadClusterName }}-infrastructure
spec:
  providerConfigRef:
    name: {{ .Values.workloadClusterName }}
  forProvider:
    source: Remote
    module: {{ .Values.workloadClusterTerraformModuleUrl }}
    vars:
    - key: cluster_name
      value: {{ .Values.workloadClusterName }}
    - key: cluster_region
      value: {{ .Values.workloadClusterRegion }}
    - key: node_count
      value: "{{ .Values.workloadNodeCount }}"
    - key: node_type
      value: {{ .Values.workloadNodeType }}
    # Theme clusters always get cilium: konstruct-web-service's per-app
    # tenant-isolation NetworkPolicies are inert under flannel.
    - key: cni
      value: "{{ if .Values.theme }}cilium{{ else }}{{ .Values.cni }}{{ end }}"

