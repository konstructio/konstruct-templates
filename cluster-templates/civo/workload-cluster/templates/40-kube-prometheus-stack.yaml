{{- if .Values.theme }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.workloadClusterName }}-kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '40'
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.workloadClusterName }}-platform
  destination:
    namespace: observability
    name: {{ .Values.workloadClusterName }}
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 68.3.0
    helm:
      releaseName: kube-prometheus-stack
      values: |
        # Grafana + Alertmanager live on the control-plane cluster; this
        # Theme cluster only scrapes and remote_writes.
        grafana:
          enabled: false
        alertmanager:
          enabled: false

        prometheus:
          enabled: true
          prometheusSpec:
            # 15s is plenty for resource graphs and keeps remote_write volume +
            # central cardinality sane across many clusters.
            scrapeInterval: 15s
            evaluationInterval: 15s
            # Local TSDB is just a buffer; the control plane's metrics store is
            # the source of truth. emptyDir (storageSpec {}) survives brief
            # remote_write outages without provisioning a PVC.
            retention: 2h
            storageSpec: {}
            externalLabels:
              cluster: {{ .Values.workloadClusterName }}
            remoteWrite:
              - url: "{{ .Values.prometheusRemoteWriteUrl }}"
                # Authenticated ingest — the endpoint is exposed to every
                # workload cluster, so it must never be open. Bearer token lives
                # in secret observability/vm-remote-write-auth (key: token).
                authorization:
                  type: Bearer
                  credentials:
                    name: vm-remote-write-auth
                    key: token
            # Discover ServiceMonitors/PodMonitors from all namespaces (e.g.
            # Envoy Gateway RED metrics, Theme app monitors), not just those
            # labelled by this Helm release.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false

        # Operator provides the ServiceMonitor/PodMonitor/Prometheus CRDs.
        prometheusOperator:
          enabled: true

        # No local alerting rules — alerting is centralised on the control plane.
        defaultRules:
          create: false

        # cAdvisor (container CPU/memory) — required for per-app resource graphs.
        kubelet:
          enabled: true
        # Replica counts, restarts, pod phase, deployment status, and the
        # namespace/pod labels used to scope metrics per org/app.
        kubeStateMetrics:
          enabled: true
        # Node-level metrics aren't needed for per-app showcase.
        nodeExporter:
          enabled: false

        # Control-plane component scrapers are infra noise for this use case.
        kubeApiServer:
          enabled: false
        kubeControllerManager:
          enabled: false
        coreDns:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        kubeEtcd:
          enabled: false
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # ServerSideApply is required — kube-prometheus-stack CRDs exceed the
      # client-side last-applied annotation size limit.
      - CreateNamespace=true
      - ServerSideApply=true
{{- end }}
