# The canonically-named ACME issuers. Every cluster gets them because charts
# reference `letsencrypt-prod` by name (gitops-catalog/ollama-openwebui does),
# and the theme issuers next door are named letsencrypt-prod-dns (the wildcard)
# and letsencrypt-http (tenant custom domains) — so a chart asking for
# `letsencrypt-prod` would find nothing.
#
# letsencrypt-prod overlaps letsencrypt-prod-dns on a theme cluster in
# everything but its name and ACME account key; keeping both is deliberate,
# since the wildcard Certificate already references prod-dns and renaming it
# would force a reissue.
{{- if .Values.theme }}
# Theme clusters solve dns01 against the same cloudflare-api-token the wildcard
# issuer uses, so these add no new dependency.
{{- else }}
# Plain workload clusters have no DNS credentials, so these solve http01
# through the shared gateway's :80 listener — an app gets TLS by declaring its
# own eg-class Gateway with a cert-manager.io/cluster-issuer annotation.
{{- end }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: {{ .Values.email }}
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
{{- if .Values.theme }}
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: token
{{- else }}
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: eg
                namespace: default
                kind: Gateway
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ .Values.email }}
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
{{- if .Values.theme }}
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: token
{{- else }}
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: eg
                namespace: default
                kind: Gateway
{{- end }}
