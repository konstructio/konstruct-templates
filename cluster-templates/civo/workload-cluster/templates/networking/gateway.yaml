{{- if .Values.theme }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg
  namespace: default
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All

    # Wildcard listener for Theme apps deployed to this cluster. Any
    # <app>.{{ .Values.workloadClusterName }}.apps.{{ .Values.domainName }} HTTPRoute attaches here; TLS is
    # served by the pre-issued per-cluster wildcard cert, so new app domains
    # are instant.
    - name: https-apps
      hostname: "*.{{ .Values.workloadClusterName }}.apps.{{ .Values.domainName }}"
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: apps-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
{{- end }}
