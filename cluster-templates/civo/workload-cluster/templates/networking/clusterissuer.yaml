{{- if .Values.theme }}
# DNS-01 issuer (Cloudflare) — wildcard certs can't be issued via HTTP-01.
# Uses the cloudflare-api-token secret provisioned into the cert-manager
# namespace by the infrastructure Terraform.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod-dns
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ .Values.email }}
    privateKeySecretRef:
      name: letsencrypt-prod-dns
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
{{- end }}
