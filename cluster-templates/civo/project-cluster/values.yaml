clusterType: management

# @input.type: boolean
# @input.description: Deploys the lightweight SaaS variant of this template (skips cert issuers, Envoy Gateway, external-dns, reloader and the ArgoCD/Crossplane HTTPRoutes). Do not change to false — provisioning will fail in the SaaS environment.
# @input.required: false
saas: true

workloadClusterTerraformModuleUrl: "git::https://github.com/konstructio/konstruct-templates.git//terraform/civo/modules/project-cluster?ref=main"

workloadClusterBootstrapTerraformModuleUrl: "git::https://github.com/konstructio/konstruct-templates.git//terraform/civo/modules/project-cluster-bootstrap?ref=main"

# @input.type: string
# @input.description: Alert email address for cert-manager notifications
# @input.required: false
email: 123@gmail.com

domainName: konstruct.io

# Wait Job Configuration
waitJobImage: "dtzar/helm-kubectl:3.19.0"


domain: saas.konstruct.io

externalDnsProviderName: cloudflare

externalDnsProviderTokenEnvName: CF_API_TOKEN
