{{- if not .Values.saas }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.workloadClusterName }}-reloader
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '30'
spec:
  project: {{ .Values.workloadClusterName }}
  source:
    repoURL: 'https://stakater.github.io/stakater-charts'
    targetRevision: 2.2.8
    chart: reloader
    helm:
      values: |-
        ignoreSecrets: false
  destination:
    name: {{ .Values.workloadClusterName }}
    namespace: reloader
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
{{- end }}
