apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.workloadClusterName }}-crossplane
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '35'
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.workloadClusterName }}
  destination:
    name: {{ .Values.workloadClusterName }}
    namespace: crossplane-system
  source:
    repoURL: https://charts.crossplane.io/stable
    chart: crossplane
    targetRevision: 1.17.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
