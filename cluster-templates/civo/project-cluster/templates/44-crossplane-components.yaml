apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.workloadClusterName }}-crossplane-components
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '44'
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.workloadClusterName }}
  source:
    repoURL: {{ .Values.gitopsRepoUrl }}
    path: registry/konstruct-clusters/{{ .Values.workloadClusterName }}/crossplane-components
    targetRevision: HEAD
  destination:
    name: {{ .Values.workloadClusterName }}
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
  # The DeploymentRuntimeConfig CRD server-prunes an empty deploymentTemplate.metadata
  # back to {}, which ArgoCD reads as perpetual drift. Ignore that field.
  ignoreDifferences:
    - group: pkg.crossplane.io
      kind: DeploymentRuntimeConfig
      name: terraform-config
      jsonPointers: ["/spec/deploymentTemplate/metadata"]
