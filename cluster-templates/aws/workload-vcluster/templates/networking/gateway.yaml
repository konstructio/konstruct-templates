# Shared HTTP entrypoint. cert-manager in this vcluster has no cloud DNS
# credentials, so certs are issued via HTTP-01 (letsencrypt issuers in
# cert-issuers/): the ACME challenge routes attach to this listener. Apps
# needing HTTPS declare their own Gateway (gatewayClassName: eg) with their
# hostname listener + a cert-manager.io/cluster-issuer annotation; with
# mergeGateways enabled those share this cluster's Envoy and LoadBalancer.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg
  namespace: default
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
