apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: argocd-application-controller
spec:
  # Must stay 1 unless ARGOCD_CONTROLLER_REPLICAS is raised to match —
  # mismatched shard count makes the controllers stomp each other
  # (wedged syncs, phantom hooks).
  replicas: 1
  template:
    spec:
      containers:
      - name: argocd-application-controller
        resources:
          requests:
            memory: 6Gi
            cpu: 2
