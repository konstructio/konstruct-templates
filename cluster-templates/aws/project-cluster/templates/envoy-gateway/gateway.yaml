{{- $extraAnnotations := list .Values.certManagerIssuerAnnotation1 .Values.certManagerIssuerAnnotation2 .Values.certManagerIssuerAnnotation3 .Values.certManagerIssuerAnnotation4 }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "35"
{{- if and .Values.certManagerClusterIssuer (not (contains "cert-manager.io/cluster-issuer" (join " " $extraAnnotations))) }}
    # cert-manager's gateway-shim watches this annotation and issues a
    # Certificate into the Secret each HTTPS listener names below. Without it
    # the listeners never get a certificate, stay unprogrammed, and every route
    # bound to them reports NoReadyListeners.
    cert-manager.io/cluster-issuer: {{ .Values.certManagerClusterIssuer }}
{{- end }}
{{- /* Escape hatch for extra raw "key: value" annotation lines. Empty slots
       are skipped rather than rendered as blank lines. */}}
{{- range $extraAnnotations }}
{{- if . }}
    {{ . }}
{{- end }}
{{- end }}
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All

    - name: https-argocd
      hostname: argocd-{{ .Values.workloadClusterName }}.{{ .Values.domainName }}
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: argocd-ingress-http
      allowedRoutes:
        namespaces:
          from: All

    - name: https-grpc-argocd
      hostname: grpc-{{ .Values.workloadClusterName }}.argocd.{{ .Values.domainName }}
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: argocd-ingress-grpc
      allowedRoutes:
        namespaces:
          from: All

    - name: https-logs
      hostname: logs-{{ .Values.workloadClusterName }}.{{ .Values.domainName }}
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: logs-mgmt-cluster
      allowedRoutes:
        namespaces:
          from: All
