apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: proxy-config
  namespace: envoy-gateway-system
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        annotations:
          # NLB passes TCP straight through so Envoy terminates TLS itself
          # (required for the Gateway's HTTPS listener certs).
          service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      envoyDeployment:
        replicas: 3
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/component: proxy
        container:
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
  concurrency: 0
  shutdown:
    drainTimeout: 30s
    minDrainDuration: 5s
