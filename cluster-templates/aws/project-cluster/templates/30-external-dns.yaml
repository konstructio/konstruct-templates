apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.workloadClusterName }}-external-dns
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '30'
spec:
  project: {{ .Values.workloadClusterName }}
  source:
    repoURL: https://kubernetes-sigs.github.io/external-dns
    targetRevision: 1.20.0
    helm:
      releaseName: external-dns
      values: |
        serviceAccount:
          create: true
          name: external-dns
          annotations:
            eks.amazonaws.com/role-arn: 'arn:aws:iam::126827061464:role/external-dns-{{ .Values.workloadClusterName }}'
        provider: aws
        # gateway route sources publish per-hostname records for
        # HTTPRoutes/GRPCRoutes (argocd UI/grpc, log-streamer), replacing
        # the previous ingress source.
        sources:
        - service
        - gateway-httproute
        - gateway-grpcroute
        domainFilters:
        - {{ .Values.workloadExternalDnsDomainName }}
        env:
        - name: not-used-uses-service-account
          valueFrom:
            secretKeyRef:
              name: external-dns-secrets
              key: token
    chart: external-dns
  destination:
    name: {{ .Values.workloadClusterName }}
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
