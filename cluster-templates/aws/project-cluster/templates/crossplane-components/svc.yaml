apiVersion: v1
kind: Service
metadata:
  name: log-streamer-service
  labels:
    app: log-streamer
spec:
  ports:
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: http
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: metrics
  selector:
    pkg.crossplane.io/provider: provider-terraform 
    pkg.crossplane.io/revision: crossplane-provider-terraform-6fe8d52ff0a1 
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: log-streamer
  namespace: crossplane-system
spec:
  parentRefs:
    - name: eg
      namespace: default
      sectionName: https-logs
  hostnames:
    - logs-{{ .Values.workloadClusterName }}.{{ .Values.domainName }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: log-streamer-service
          port: 9090
      # long-lived log streams (was nginx proxy-read/send-timeout: 3600)
      timeouts:
        request: 3600s
