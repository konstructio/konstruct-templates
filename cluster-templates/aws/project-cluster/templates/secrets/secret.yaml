apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-credentials-template-{{ .Values.projectOrg | replace "/" "-" | lower }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '20'
  labels:
    app.kubernetes.io/part-of: argocd
spec:
  refreshInterval: 10s
  secretStoreRef:
    kind: {{ .Values.secretStoreKind }}
    name: {{ .Values.workloadClusterName }}-vault-kv-secret
  target:
    name: repo-credentials-template-{{ .Values.projectOrg | replace "/" "-" | lower }}
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          managed-by: argocd.argoproj.io
        labels:
          argocd.argoproj.io/secret-type: repository
      type: Opaque
      data:
        type: {{`"{{ .type }}"`}}
        url: {{`"{{ .url }}"`}}
        githubAppID: {{`"{{ .githubAppID }}"`}}
        githubAppInstallationID: {{`"{{ .githubAppInstallationID }}"`}}
        githubAppPrivateKey: {{`"{{ .githubAppPrivateKey }}"`}}
  dataFrom:
    - extract:
        key: argocd/repo-credentials-template/{{ .Values.workloadClusterProjectName }}
---
apiVersion: external-secrets.io/v1
