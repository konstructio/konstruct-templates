apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.workloadClusterName }}-argocd
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Last platform wave: ArgoCD's own HTTPRoute/GRPCRoute pin sectionName on
    # the shared `eg` Gateway (created at 40) and their TLS comes from the
    # cert-issuers (35), so it cannot sync alongside them.
    argocd.argoproj.io/sync-wave: '44'
spec:
  project: {{ .Values.workloadClusterName }}
  source:
    repoURL: {{ .Values.gitopsRepoUrl }}
    path: registry/konstruct-clusters/{{ .Values.workloadClusterName }}/argocd
    targetRevision: HEAD
  destination:
    name: {{ .Values.workloadClusterName }}
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
