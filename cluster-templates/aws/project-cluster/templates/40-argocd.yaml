apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.workloadClusterName }}-argocd
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Wave 40: ArgoCD's own HTTPRoute/GRPCRoute pin sectionName on the shared
    # `eg` Gateway, which envoy-gateway-components creates at 35, and their TLS
    # comes from the cert-issuers at 40. Syncing at 30 left the routes with no
    # listener to attach to. Matches civo/project-cluster.
    argocd.argoproj.io/sync-wave: '40'
spec:
  project: {{ .Values.workloadClusterName }}
  source:
    repoURL: {{ .Values.gitopsRepoUrl }}
    path: registry/konstruct-clusters/{{ .Values.workloadClusterName }}/argocd
    targetRevision: HEAD
  destination:
    name: {{ .Values.workloadClusterName }}
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
