clusterType: management

# Terraform Module Configuration
# @input.type: string
# @input.description: the complete URL for the Terraform module for infrastructure provisioning
# @input.required: true
workloadClusterTerraformModuleUrl: "git::https://github.com/konstructio/konstruct-templates.git//terraform/aws/modules/workload-project-cluster?ref=main"

# @input.type: string
# @input.description: the complete URL for the Terraform module for infrastructure bootstrap provisioning
# @input.required: true
workloadClusterBootstrapTerraformModuleUrl: "git::https://github.com/konstructio/konstruct-templates.git//terraform/aws/modules/project-bootstrap?ref=main"

# @input.type: string
# @input.description: Alert email address for cert-manager notifications
# @input.required: false
email: alerts@konstruct.io

# @input.type: string
# @input.description: Domain name used for cluster gateway hostnames
# @input.required: true
domainName: konstruct.io

# External Secrets store scope for the Vault KV store and its consumers
# @input.type: enum
# @input.description: Scope of the external-secrets Vault store. ClusterSecretStore is cluster-wide; SecretStore creates a namespaced store in each namespace listed in secretStoreNamespaces (each needs the vault bootstrap token secret).
# @input.options: ClusterSecretStore,SecretStore
# @input.required: false
# @input.default: ClusterSecretStore
secretStoreKind: ClusterSecretStore

# Namespaces that receive a namespaced Vault SecretStore when secretStoreKind is SecretStore
secretStoreNamespaces:
  - argocd
  - crossplane-system
  - github-runner

# Wait Job Configuration
waitJobImage: "dtzar/helm-kubectl:3.19.0"

# cert-manager issuer annotations injected into the shared Gateway (full "key: value" lines)
certManagerIssuerAnnotation1: ""
certManagerIssuerAnnotation2: ""
certManagerIssuerAnnotation3: ""
certManagerIssuerAnnotation4: ""

# ---------------------------------------------------------------------------
# Platform-supplied values
#
# The values below are injected by the operator at hydration time and are
# deliberately NOT declared here, so they never appear as form fields. They
# are documented for template authors; the operator's defaults can be
# overridden per hydration.
#
# From the cluster request:
#   workloadClusterName             name of the project cluster
#   workloadClusterRegion           region of the project cluster
#   workloadNodeCount               number of nodes in the project cluster
#   workloadNodeType                node (instance) type of the project cluster
#   workloadAmiType                 AMI type of the project cluster
#
# Git / gitops repository:
#   gitopsRepoUrl                   URL of the main/root gitops repository
#   repoName                        name of the gitops repo for the project/org
#   workloadClusterProjectName      name of the project/org
#   projectOrg                      org name associated with the project's git connection
#   platformOrg                     org of the platform team
#
# AWS accounts and cross-account provisioning:
#   workloadClusterAccountId        AWS account id where the project cluster is provisioned
#   workloadAssumeRole              role ARN assumed by Crossplane on the main
#                                   management cluster to provision resources in
#                                   the project cluster account
#
# Main management cluster:
#   kubefirstMgmtClusterName        name of the main management cluster
#   kubefirstMgmtAccountId          AWS account id of the main management cluster
#   mainMgmtcloudRegion             region of the main management cluster
#   kubefirstStateStoreBucket       S3 state-store bucket of the main management cluster
#
# Project cluster resources:
#   workloadS3BucketName            new S3 bucket for the project cluster, storing
#                                   workload cluster Terraform state
#   workloadExternalDnsDomainName   domain filter for the external-dns application
#                                   on the project cluster
# ---------------------------------------------------------------------------
