apiVersion: tf.upbound.io/v1beta1
kind: Workspace
metadata:
  name: {{ .Values.workloadClusterName }}-infrastructure
spec:
  providerConfigRef: 
    name: {{ .Values.workloadClusterName }}
  forProvider:
    source: Remote
    module: {{ .Values.workloadClusterTerraformModuleUrl }}
    vars:
    - key: cluster_name
      value: "{{ .Values.workloadClusterName }}"
    - key: cluster_region
      value: "{{ .Values.workloadClusterRegion }}"
    - key: node_count
      value: "{{ .Values.workloadNodeCount }}"
    - key: node_type
      value: "{{ .Values.workloadNodeType }}"
    - key: ami_type
      value: "{{ .Values.workloadAmiType }}"
    - key: project_aws_account_id
      value: "{{ .Values.projectAwsAccountId }}"
    - key: project_cluster_name
      value: "{{ .Values.projectClusterName }}"
    - key: dex_provider_name
      value: "{{ .Values.dexProviderName }}"
    # Empty skips the EKS OIDC identity provider config in the module.
    - key: dex_issuer_url
      value: "{{ .Values.dexIssuerUrl }}"
    # Theme clusters always enforce NetworkPolicies: konstruct-web-service's
    # per-app tenant-isolation policies are inert without the VPC CNI's
    # network policy agent.
    - key: enable_network_policy
      value: "{{ if .Values.theme }}true{{ else }}{{ .Values.enableNetworkPolicy }}{{ end }}"
    # Theme clusters: the control plane's konstruct operators reach the
    # cluster directly (vm-remote-write token sync) as the WORKLOAD account's
    # konstruct role — the in-account role their pods assume via the mirrored
    # OIDC trust, which can also DescribeCluster for endpoint discovery. This
    # entry authorizes it on the cluster. Empty (non-theme) adds no entry.
    - key: konstruct_operator_role_arn
      value: "{{ if .Values.theme }}arn:aws:iam::{{ .Values.workloadClusterAccountId }}:role/konstruct-{{ .Values.kubefirstMgmtClusterName }}{{ end }}"


