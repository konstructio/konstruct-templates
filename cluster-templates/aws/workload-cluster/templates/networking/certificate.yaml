# Per-cluster wildcard cert. Issued once via DNS-01; every
# <app>.{{ include "aws-workload-cluster.appsDomain" . }} is then HTTPS instantly (no per-app ACME).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: apps-wildcard
  namespace: default
spec:
  secretName: apps-wildcard-tls
  issuerRef:
    name: letsencrypt-prod-dns
    kind: ClusterIssuer
  commonName: "*.{{ include "aws-workload-cluster.appsDomain" . }}"
  dnsNames:
    - "*.{{ include "aws-workload-cluster.appsDomain" . }}"
