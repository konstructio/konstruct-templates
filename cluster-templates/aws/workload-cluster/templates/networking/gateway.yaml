apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg
  namespace: default
spec:
  gatewayClassName: eg
  listeners:
    # Plain HTTP, also carries cert-manager's http01 ACME challenge routes
    # for the letsencrypt-staging/letsencrypt-prod issuers.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All

    # Wildcard listener for apps deployed to this cluster. Any
    # <app>.{{ .Values.workloadExternalDnsDomainName }} HTTPRoute attaches
    # here; TLS is served by the pre-issued per-cluster wildcard cert, so new
    # app domains are instant.
    - name: https-apps
      hostname: "*.{{ .Values.workloadExternalDnsDomainName }}"
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: apps-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
