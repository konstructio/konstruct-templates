# mergeGateways lets per-app custom-domain Gateways share this cluster's
# single Envoy data plane and LoadBalancer instead of provisioning one each.
# NOTE: flipping this on an existing cluster recreates the proxy Service (new
# LB; external-dns re-points the wildcard from this Service's annotation).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: proxy-config
  namespace: envoy-gateway-system
spec:
  mergeGateways: true
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        annotations:
          # NLB passes TCP straight through so Envoy terminates TLS itself
          # (required for the Gateway's HTTPS listener certs).
          service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
          # ONE wildcard record pointed at the shared LB, published by
          # external-dns' service source. New app hostnames resolve instantly
          # without waiting for a per-route record.
          external-dns.alpha.kubernetes.io/hostname: "*.{{ .Values.workloadExternalDnsDomainName }}"
