apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  url: 'https://argocd.{{ .Values.domainName }}'
  oidc.config: |
    name: Vault
    issuer: https://vault.{{ .Values.domainName }}/v1/identity/oidc/provider/kubefirst
    clientID: $argocd-oidc-secret:clientId
    clientSecret: $argocd-oidc-secret:clientSecret
    requestedScopes: ["openid", "groups", "user", "profile", "email"]
    requestedIDTokenClaims: {"groups": {"essential": true}}
  # Overrides the upstream base blob: nil-guarded Workspace health.lua
  # (unguarded concat crashes comparison when only one condition is present).
  resource.customizations: |
    argoproj.io/Application:
      health.lua: |
        hs = {}
        hs.status = "Progressing"
        hs.message = ""
        if obj.status ~= nil then
          if obj.status.health ~= nil then
            hs.status = obj.status.health.status
            if obj.status.health.message ~= nil then
              hs.message = obj.status.health.message
            end
          end
        end
        return hs
    
    tf.upbound.io/Workspace:
      health.lua: |
        local hs = {}
        if obj.status ~= nil then
          if obj.status.conditions ~= nil then
            local installed = false
            local healthy = false
            for i, condition in ipairs(obj.status.conditions) do
              if condition.type == "Ready" then
                installed = condition.status == "True"
                installed_message = condition.reason
              elseif condition.type == "Synced" then
                healthy = condition.status == "True"
                healthy_message = condition.reason
              end
            end
            if installed and healthy then
              hs.status = "Healthy"
            else
              hs.status = "Degraded"
            end
            hs.message = (installed_message or "") .. " " .. (healthy_message or "")
            return hs
          end
        end
    
        hs.status = "Progressing"
        hs.message = "Waiting for wworkspace to finish running"
        return hs      
