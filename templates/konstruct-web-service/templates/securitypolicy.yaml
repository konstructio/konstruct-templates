{{- /*
Platform auth gate opt-out (epic &231). The default gate is a single
listener-scoped OIDC SecurityPolicy on the shared Envoy Gateway (delivered
per cluster via gitops), which authenticates EVERY themed-app host — so the
gated case renders nothing here. The only per-app action is the opt-out:
when the operator sets gateway.authExempt (spec.auth "none"), render an
empty, route-scoped SecurityPolicy. In Envoy Gateway a policy targeting an
HTTPRoute overrides one targeting the Gateway (no merge), and a policy with
no security features leaves the route anonymous — so this deliberately makes
the app fully public. The public warning UX lives in the console.

targetRefs MUST name the HTTPRoute this chart actually renders, which here
comes from the fullname helper — NOT .Release.Name as in the konstruct-gitops
copy of this chart, which has no helpers and names its route after the
release. Under theme-operator the two differ: fullnameOverride is
spec.app_name ("zippy") while releaseName is the CR name ("zippy-dev"). A
policy pointing at a route that does not exist is simply not accepted, and
the app then stays GATED — the opt-out silently does nothing.
*/ -}}
{{- if and .Values.gateway.enabled .Values.gateway.authExempt }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ include "konstruct-web-service.fullname" . }}-public
  labels:
    {{- include "konstruct-web-service.labels" . | nindent 4 }}
spec:
  # Empty spec (targetRef only): overrides the listener gate for this route,
  # exempting it from authentication.
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "konstruct-web-service.fullname" . }}
{{- end }}
