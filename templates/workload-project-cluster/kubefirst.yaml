# +argocd:skip-file-rendering

# for more information on custom cluster templating see:
# https://kubefirst-pro.konstruct.io/docs/features/clusters/custom-templates
# uncomment the inputs below to propt your users for input variable values

clusterType: "physical"
inputs:
  - name: "Terraform module URL"
    token: "<WORKLOAD_CLUSTER_TERRAFORM_MODULE_URL>"
    prompt: "The go-getter source of the Terraform module for this workload cluster, e.g git::https://github.com/<org>/<repo>.git//terraform/aws/modules/workload-project-cluster?ref=main (branch or tag). Leave empty to use the platform default."
  - name: "IPAM pool ID"
    token: "<IPAM_POOL_ID>"
    prompt: "AWS IPAM pool ID to allocate the cluster's VPC CIDR from"
  - name: "Workload CIDR"
    token: "<WORKLOAD_CIDR>"
    prompt: "VPC CIDR for the workload cluster. Leave empty to allocate automatically from the IPAM pool."
  - name: "EKS add-ons"
    token: "<WORKLOAD_EKS_ADDONS>"
    prompt: "EKS add-ons to enable on the cluster. Leave empty for the defaults."
  - name: "Team name"
    token: "<TEAM_NAME>"
    prompt: "The team that owns this workload cluster"
  - name: "PrivateLink workload clusters"
    token: "<PRIVATELINK_WORKLOAD_CLUSTERS_JSON>"
    prompt: "JSON array of workload clusters to expose to this cluster via AWS PrivateLink. Leave empty for none."
