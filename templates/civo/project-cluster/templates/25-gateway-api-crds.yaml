apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.workloadClusterName }}-gateway-api-crds
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: '25'
spec:
  project: {{ .Values.workloadClusterName }}
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api
    # Must match the gateway-api bundle the envoy-gateway chart ships
    # (v1.7.0 bundles v1.4.1 experimental) — mismatched channels flip-flop
    # the shared CRDs between the two owners forever.
    targetRevision: v1.4.1
    path: config/crd/experimental
    directory:
      recurse: true
  destination:
    name: {{ .Values.workloadClusterName }}
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
