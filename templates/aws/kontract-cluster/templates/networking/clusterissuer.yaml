# DNS-01 issuer (Route53) — wildcard certs can't be issued via HTTP-01.
# cert-manager's service account assumes its IRSA role (annotated in
# 30-cert-manager.yaml), so no explicit credentials are needed here.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod-dns
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ .Values.email }}
    privateKeySecretRef:
      name: letsencrypt-prod-dns
    solvers:
      - dns01:
          route53:
            region: {{ .Values.workloadClusterRegion }}
